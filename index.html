<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Guia interativo de Extensão Curricular da UniLS: temas, ODS, DCNs, parceiros, trilha e critérios de avaliação.">
  <meta name="theme-color" content="#163b63">
  <title>Extensão Curricular UniLS — Guia Interativo</title>
  <style>
    :root{
      --red:#e50035;
      --red-700:#b8002a;
      --navy:#163b63;
      --navy-900:#0d2742;
      --teal:#08a88a;
      --teal-100:#e8f8f4;
      --orange:#ef8517;
      --gold:#f4c44f;
      --ink:#17202a;
      --muted:#5b6774;
      --line:#dfe5eb;
      --surface:#ffffff;
      --surface-2:#f5f8fb;
      --surface-3:#eef4f8;
      --success:#137a52;
      --warning:#a15d00;
      --danger:#b42318;
      --shadow:0 18px 48px rgba(18, 49, 79, .12);
      --shadow-sm:0 8px 24px rgba(18, 49, 79, .10);
      --radius:22px;
      --radius-sm:14px;
      --max:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:92px}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--surface);line-height:1.6}
    img{max-width:100%;display:block}
    a{color:inherit}
    button,input,select{font:inherit}
    button{cursor:pointer}
    :focus-visible{outline:3px solid rgba(8,168,138,.45);outline-offset:3px}
    .skip-link{position:fixed;z-index:9999;left:16px;top:-100px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;text-decoration:none}
    .skip-link:focus{top:16px}
